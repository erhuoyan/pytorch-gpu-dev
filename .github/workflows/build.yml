name: build-image

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'start.sh'
      - 'wheels/**/urls.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which variant to build (directory under wheels/)'
        required: true
        default: 'cu128-torch2.11'
        type: choice
        options:
          - cu128-torch2.11
      tag:
        description: 'Tag suffix (default: build date). Tags produced: <variant>-<suffix>, <variant>, latest'
        required: false
        default: ''

env:
  IMAGE_NAME: pytorch-gpu-dev

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      variant: ${{ steps.v.outputs.variant }}
      base_image: ${{ steps.v.outputs.base_image }}
      wheels_dir: ${{ steps.v.outputs.wheels_dir }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Resolve variant
        id: v
        run: |
          set -euo pipefail
          VARIANT="${{ github.event.inputs.variant }}"
          [[ -z "$VARIANT" ]] && VARIANT="cu128-torch2.11"
          case "$VARIANT" in
            cu128-torch2.11) BASE_IMAGE="pytorch/pytorch:2.11.0-cuda12.8-cudnn9-runtime" ;;
            *) echo "Unknown variant: $VARIANT" >&2; exit 1 ;;
          esac
          SUFFIX="${{ github.event.inputs.tag }}"
          [[ -z "$SUFFIX" ]] && SUFFIX="$(date +%d%m%Y)"
          {
            echo "variant=$VARIANT"
            echo "base_image=$BASE_IMAGE"
            echo "wheels_dir=wheels/$VARIANT"
            echo "tag=$SUFFIX"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheels from object storage / releases
        run: |
          set -euo pipefail
          WD="${{ needs.prepare.outputs.wheels_dir }}"
          MANIFEST="$WD/urls.txt"
          [[ -f "$MANIFEST" ]] || { echo "ERROR: missing $MANIFEST" >&2; exit 1; }
          grep -vE '^\s*(#|$)' "$MANIFEST" | while read -r url; do
            fname="$(basename "$url")"
            echo ">>> downloading $fname"
            curl -fL --retry 3 --retry-delay 5 --connect-timeout 20 -o "$WD/$fname" "$url"
          done
          ls -lh "$WD"/*.whl

      - name: Verify wheels are real files
        run: |
          set -euo pipefail
          WD="${{ needs.prepare.outputs.wheels_dir }}"
          for f in "$WD"/*.whl; do
            if file "$f" | grep -q "ASCII text"; then
              echo "ERROR: $f is a text/LFS pointer, not a wheel" >&2
              exit 1
            fi
            unzip -l "$f" > /dev/null || { echo "ERROR: $f is not a valid zip/wheel" >&2; exit 1; }
          done
          echo "all wheels valid"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -af || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.prepare.outputs.base_image }}
            WHEELS_DIR=${{ needs.prepare.outputs.wheels_dir }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.variant }}-${{ needs.prepare.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.variant }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## Built \`${{ env.IMAGE_NAME }}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Variant | \`${{ needs.prepare.outputs.variant }}\` |"
            echo "| Base | \`${{ needs.prepare.outputs.base_image }}\` |"
            echo "| Wheels | \`${{ needs.prepare.outputs.wheels_dir }}\` |"
            echo "| Tags | \`:*-${tag}\`, \`:${variant}\`, \`:latest\` |"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          tag: ${{ needs.prepare.outputs.tag }}
          variant: ${{ needs.prepare.outputs.variant }}
